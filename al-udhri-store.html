<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Udhri Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Oswald:wght@500;700&display=swap">
<style>
:root{
  --black:#0a0a0a; --panel:#141414; --panel2:#1d1d1d; --line:#2c2c2c; --ink:#f4f4f4; --muted:#a3a3a3;
  --lime:#c6ea2c; --on-lime:#0a0a0a; --strip:#f3f4f1; --strip-ink:#111111; --loss:#ff8a80;
  --head:"Oswald","Arial Narrow","Impact",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--black);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.top{position:sticky;top:0;z-index:4;background:var(--black);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--black)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--head);font-size:1.6rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.brand span{color:var(--lime);font-size:1.15rem}
.search{display:block;flex:1;max-width:320px}
.search input{width:100%;padding:9px 12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px}
.hero{background:var(--black);padding:40px 16px 34px}
.in{max-width:900px;margin:0 auto}
.kick{color:var(--lime);font-family:var(--head);font-weight:500;letter-spacing:.12em;font-size:.9rem;text-transform:uppercase;margin:0 0 8px}
.hero h1{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(2.4rem,11vw,4.4rem);line-height:1;margin:0 0 14px;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p.lead{margin:0 0 20px;color:var(--muted);max-width:30ch}
.btn,button{font:inherit;cursor:pointer;border-radius:4px;padding:12px 22px;border:1px solid var(--line);background:transparent;color:var(--ink);
  font-family:var(--head);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-block;text-align:center}
.main{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.strip{background:var(--strip);color:var(--strip-ink);padding:14px 16px}
.strip .in{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:.85rem}
.strip b{display:block;font-size:.85rem}
.strip span{color:#555}
section.shop{padding:30px 14px 36px}
h2.sec{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1.4rem;text-align:center;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;overflow:hidden;border-radius:4px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:10px}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .tee{font-size:3.1rem;line-height:1}
.pic .cal{font-size:1.25rem;color:var(--lime);font-weight:500}
.card h3{font-family:var(--head);font-weight:500;text-transform:uppercase;letter-spacing:.03em;font-size:.95rem;margin:0 0 2px}
.card p{margin:0 0 8px;color:var(--muted);font-size:.8rem;flex:1}
.price{font-family:var(--head);font-size:1.25rem;font-weight:700}
.mrp{font-size:.85rem;color:var(--muted);text-decoration:line-through;margin-left:6px}
.off{font-size:.85rem;color:var(--lime);margin-left:6px;font-weight:700}
.deliv{font-size:.75rem;color:var(--lime);margin:2px 0 10px}
.card .main{width:100%;padding:10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.none{color:var(--muted);text-align:center;padding:24px 0}
[hidden]{display:none!important}
.chips{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.chip{padding:8px 16px;border-radius:999px;font-size:.85rem;letter-spacing:.06em}
.chip.on{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
footer{background:var(--panel);border-top:1px solid var(--line);padding:26px 16px calc(26px + env(safe-area-inset-bottom,0px));text-align:center}
footer b{font-family:var(--head);font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase;display:block}
footer span{color:var(--muted);font-size:.85rem}
.overlay{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));
  border-radius:14px 14px 0 0;margin-top:auto;max-height:100%;overflow-y:auto}
.sheet h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.05em;margin:0 0 2px;font-size:1.3rem}
.sub{margin:0 0 12px;color:var(--muted);font-size:.9rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea{width:100%;margin-top:3px;padding:10px 12px;font:inherit;font-size:1rem;color:var(--ink);
  background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin:6px 0 10px}
.total span:last-child{color:var(--lime)}
.err{color:var(--loss);font-size:.9rem;min-height:1.3em;margin:0 0 6px}
.actions{display:grid;gap:8px}
.actions .main{width:100%}
textarea.copy{height:120px;font-size:.85rem}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><b>Al Udhri</b><span lang="ar" dir="rtl">العذري</span></div>
    <label class="search"><input id="q" type="search" placeholder="Search" aria-label="Search products"></label>
  </div>
</header>

<section class="hero">
  <div class="in">
    <p class="kick">Al Udhri</p>
    <h1>Men’s fashion <em>essentials</em></h1>
    <p class="lead">T-shirts and watches for every day.</p>
    <button class="main" id="shop" type="button">Shop now</button>
  </div>
</section>

<div class="strip"><div class="in">
  <div><b>Pay on delivery</b><span>Pay when it arrives</span></div>
  <div><b>T-shirts and watches</b><span>Men’s fashion</span></div>
  <div><b>WhatsApp support</b><span>We confirm every order</span></div>
</div></div>

<section class="shop" id="products">
  <div class="in">
    <h2 class="sec">Shop now</h2>
    <div class="chips" id="chips"><button class="chip on" data-c="all" type="button">All</button><button class="chip" data-c="tshirt" type="button">T-Shirts</button></div>
    <div class="grid" id="grid"></div>
    <p class="none" id="none" hidden>No products found.</p>
  </div>
</section>

<footer><b>Al Udhri</b><span>Men’s fashion · Orders confirmed on WhatsApp</span></footer>

  ];
  var $=function(i){return document.getElementById(i)};
  var cat="all";
  function money(x){return "₹"+x.toLocaleString("en-IN")}

  function wa(p){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hi Al Udhri, I want to order: "+p.name+" ("+money(p.price)+"). Please share the details.")}

  function show(){
    var q=$("q").value.trim().toLowerCase();
    var list=PRODUCTS.filter(function(p){return (p.name+" "+p.desc).toLowerCase().indexOf(q)>-1&&(cat==="all"||p.cat===cat)});
    $("none").hidden=list.length>0;
    $("grid").innerHTML=list.map(function(p){
      var off=p.mrp&&p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
      return '<article class="card"><div class="pic">'+(p.img?'<img alt="'+p.name+'" src="'+p.img+'">':'<span class="tee">'+(p.cat==="watch"?"⌚":"👕")+'</span>')+'</div>'+
        '<h3>'+p.name+'</h3><p>'+p.desc+'</p>'+
        '<div><span class="price">'+money(p.price)+'</span>'+(off?'<span class="mrp">'+money(p.mrp)+'</span><span class="off">'+off+'% off</span>':'')+'</div>'+
        '<div class="deliv">Pay on delivery</div>'+
        '<a class="btn main" target="_blank" rel="noopener" href="'+wa(p)+'">Buy on WhatsApp</a></article>';
    }).join("");
  }
  show();
  $("q").addEventListener("input",show);
  $("chips").addEventListener("click",function(e){var b=e.target.closest("button[data-c]");if(!b)return;cat=b.getAttribute("data-c");Array.prototype.forEach.call($("chips").children,function(c){c.className=c===b?"chip on":"chip"});show()});
  $("shop").addEventListener("click",function(){$("products").scrollIntoView({behavior:"smooth"})});

})();
</script>
